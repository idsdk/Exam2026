<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chap09</title>
</head>
<body>
    <h2>1. Bean Validation 유형 유효성 검사</h2>
    <form th:object="${product}" action="/exam09_01" method="post">
        <p>제품명: <inpu type="text" th:field="+{name}"></p>
        <p>가격: <inpu type="text" th:field="+{price}"></p>
        <p>
            <button type="submit">확인</button>&nbsp;&nbsp;
            <button type="reset">취소</button>
        </p>
    </form>
</body>
</html>
